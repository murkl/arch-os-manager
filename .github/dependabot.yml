# One pull request a week, under a ci: title. A release is taken after a week,
# as a compromised one is usually pulled by then, except for murkl/workflows.
# The crates are pinned by Cargo.lock and raised by hand.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: ["murkl/*"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
