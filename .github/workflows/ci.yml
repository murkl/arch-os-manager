# Pull requests are checked.

name: CI

on:
  pull_request:

permissions: {}

# Every step in bash with pipefail, as the Makefile runs its recipes.
defaults:
  run:
    shell: bash

# A new push replaces a pull request's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make check` on Arch, as the machines it runs on.
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The date names the base, the digest pins it. Publish uses the same.
    container: archlinux:base-devel-20261011.0.609700@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    permissions:
      contents: read
    steps:
      # git refuses root a checkout owned by the runner's user. The build reads
      # the last release tag, so the history comes along.
      - run: |
          pacman -Syu --noconfirm --needed rust shellcheck shfmt yamllint actionlint zizmor gettext gitleaks pacman-contrib git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The compiler comes from today's Arch and keys the cache with the lock
      # file: a cache built by another one is rebuilt whole and never saved.
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      - run: make check
