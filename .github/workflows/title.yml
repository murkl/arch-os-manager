# The title becomes the squash commit on main, which release-please reads. A
# workflow of its own, so editing a title reruns only this.

name: Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]+\))?!?: .' <<<"$TITLE" || {
            echo "::error::'${TITLE}' opens on no type: feat:, fix:, feat!: …"
            exit 1
          }
