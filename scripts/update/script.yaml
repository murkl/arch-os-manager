ops:
  list:
    title: Checking for updates
    needs: [pacman-contrib]
  run:
    title: Updating the system
    root: true
    steps:
      repo: Official packages
      aur: AUR packages
      flatpak: Flatpak apps
errors:
  10: |
    The update check failed
    The package servers could not be reached. Check the internet connection.
  11: |
    The AUR check failed
    The AUR helper could not ask the AUR for updates. Check the internet connection.
  12: |
    The Flatpak check failed
    The Flatpak remotes could not be reached. Check the internet connection.
