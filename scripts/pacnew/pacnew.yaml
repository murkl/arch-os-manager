ops:
  list:
    title: Finding configuration updates
  diff:
    title: Comparing the configuration
  take:
    title: Applying the configuration update
    root: true
    steps:
      snapshot: Taking a snapshot
  keep:
    title: Applying the configuration update
    root: true
  merge:
    title: Merging the configuration
    root: true
    needs: [meld]
    steps:
      snapshot: Taking a snapshot
errors:
  10: |
    The files cannot be compared
    One of them can only be read as root, or the original no longer exists. Take over or keep the new version without comparing, or merge it in Meld.
  11: |
    This is no configuration update
    Only the files pacman leaves beside a configuration, such as .pacnew and .pacsave, are taken over, removed or merged.
  12: |
    Nothing was merged
    The configuration was not changed in Meld, so the new version stays for later.
  13: |
    The merged configuration does not parse
    visudo found an error in it, so the configuration stays as it was. Merge again.
