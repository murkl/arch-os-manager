# Causes recognised in the output of any run, by a line containing the key, and
# the page that fixes them.
hints:
  unable to lock database:
    text: |
      The package database is locked
      Another package manager is running, or one stopped halfway. Once none is running, Repair removes the stale lock.
    offer: repair
  "(PGP signature)":
    text: |
      A signature could not be verified
      The keyring is probably out of date. Repair renews it and updates afterwards.
    offer: repair
  exists in filesystem:
    text: |
      A file is in the way
      A package brings a file that already exists on disk and belongs to no package. The details name it; remove or move it, then update again.
  failed retrieving file:
    text: |
      A download failed
      Check the internet connection, or rank the mirrors again.
    offer: mirrors
  not enough free disk space:
    text: |
      The disk is full
      Clean up frees space; then update again.
    offer: cleanup
  breaks dependency:
    text: |
      A dependency would break
      Another package still needs what was to be removed or replaced. The details name both.
