ops:
  run:
    title: Repairing the package management
    root: true
    steps:
      lock: Removing the stale lock
      keyring: Updating the keyring
      upgrade: Updating the system
  keyring:
    title: Recreating the keyring
    root: true
    confirm: |
      Recreate the keyring?
      Keys imported by hand are lost.
  files:
    title: Checking the files of every package
    root: true
    steps:
      check: Checking the files
  reinstall:
    title: Reinstalling the altered packages
    root: true
errors:
  10: |
    Package manager running
    Wait until it finishes.
  11: |
    Unexpected keyring location
    GPGDir in pacman.conf does not end in gnupg.
  12: |
    Files not checked
  13: |
    System not up to date
    Update first.
hints:
  "The requested URL returned error: 404":
    text: |
      Package no longer on the server
    offer: upgrade
