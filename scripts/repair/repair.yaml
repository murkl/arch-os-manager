ops:
  run:
    title: Repairing the package management
    root: true
    confirm: |
      Repair the package management?
      A leftover lock is removed, the keyring is created anew, and the system is updated. Keys added by hand, such as those of third-party repositories, have to be added again.
    steps:
      lock: Removing the stale lock
      keyring: Creating the keyring anew
      upgrade: Updating the system
  files:
    title: Checking the files of every package
    root: true
    steps:
      check: Checking the files
      reinstall: Reinstalling the altered packages
errors:
  10: |
    A package manager is running
    It holds the package database. Wait until it is done, then repair.
  11: |
    The keyring is not where it is expected
    pacman.conf names a GPGDir not ending in gnupg, so it is left alone.
  12: |
    The files could not be checked
    pacman did not get to compare them. The details show what it reported.
hints:
  "The requested URL returned error: 404":
    text: |
      A package is no longer on the server
      The list of packages is older than the server's. Update the system, then try again.
    offer: upgrade
