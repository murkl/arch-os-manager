ops:
  apply:
    title: Updating the menu entry and the notification
  notify:
    title: Showing a notification
    needs: [libnotify]
  close:
    title: Closing the notification
  open:
    title: Opening the manager
  extension-install:
    title: Installing the GNOME extension
  extension-remove:
    title: Removing the GNOME extension
errors:
  10: |
    Program path unusable in a menu entry
    Move the program to a path without " \ ` $ %.
  11: |
    Extension not installed
  12: |
    Extension installed by a package
    Remove it on the Packages page.
  13: |
    Update indicator not set up
