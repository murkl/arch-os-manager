# Causes recognised in the output of any run, by a line containing the key, and
# the page that fixes them.
hints:
  unable to lock database:
    text: |
      Package database locked
    offer: repair
  "(PGP signature)":
    text: |
      Signature not verified
      Renew the keyring with Repair.
    offer: repair
  exists in filesystem:
    text: |
      File conflict
      Remove or move the file.
  failed retrieving file:
    text: |
      Download failed
      Check the connection or rank the mirrors.
    offer: mirrors
  not enough free disk space:
    text: |
      Disk full
    offer: cleanup
  breaks dependency:
    text: |
      Dependency would break
  invalid or corrupted database:
    text: |
      Package database not verified
    offer: mirrors
  is unknown trust:
    text: |
      Signature not verified
      Renew the keyring with Repair.
    offer: repair
  No space left on device:
    text: |
      Disk full
    offer: cleanup
  could not satisfy dependencies:
    text: |
      Missing dependency
  Could not resolve host:
    text: |
      No internet connection
  is not in the sudoers file:
    text: |
      User not in sudoers
      Add the user to wheel and allow wheel with visudo.
  incorrect password attempt:
    text: |
      Wrong password three times
  "error while loading shared libraries: libalpm":
    text: |
      AUR helper built for an older pacman
      Rebuild it.
    offer: features
