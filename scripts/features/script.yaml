ops:
  probe:
    title: Checking the optional packages
  install:
    title: Installing
    root: true
  remove:
    title: Removing
    root: true
errors:
  10: |
    The AUR could not be reached
    Check the internet connection.
# What a package may need of the system, and why it is not offered without.
facts:
  desktop: needs a desktop
  gnome: needs GNOME
# Each optional package under its kind, the call whose answer proves it works,
# and what it adds. A gnome-extension is set up by the desktop script, from
# extensions.gnome.org instead of a package.
probe:
  aur-helper:
    paru:
      command: [paru, --version]
      adds: Packages from the AUR
    yay:
      command: [yay, --version]
      adds: Packages from the AUR
  firmware-updater:
    fwupd:
      command: [fwupdmgr, --version]
      adds: Firmware updates
  gnome-extension:
    arch-update:
      command: [arch_update_dir]
      adds: Pending updates in the GNOME top bar
      needs: gnome
  merge-tool:
    meld:
      command: [meld, --version]
      adds: Merging configuration updates side by side
      needs: desktop
  notifier:
    libnotify:
      command: [notify-send, --version]
      adds: Notifications about new updates
      needs: desktop
  package-manager:
    flatpak:
      command: [flatpak, --version]
      adds: Flatpak apps in the update and the clean-up
      needs: desktop
  pacman-tool:
    pacman-contrib:
      command: [checkupdates, --version]
      adds: The list of updates, the clean-up and the configuration updates
    reflector:
      command: [reflector, --help]
      adds: Ranking the mirrors
