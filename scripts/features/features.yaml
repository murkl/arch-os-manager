ops:
  probe:
    title: Checking the optional packages
  install:
    title: Installing
    root: true
  remove:
    title: Removing
    root: true
errors:
  10: |
    The AUR could not be reached
    Check the internet connection.
hints:
  "The requested URL returned error: 404":
    text: |
      A package is no longer on the server
      The list of packages is older than the server's. Update the system, then try again.
    offer: upgrade
# What a package may need of the system, and why it is not offered without.
facts:
  desktop: needs a desktop
  wayland: needs a Wayland session
  gnome: needs GNOME
# Each optional package under its group, the call whose answer proves it works,
# and what it adds. An extension is set up by the desktop script, from
# extensions.gnome.org instead of a package.
probe:
  packages:
    paru:
      command: [paru, --version]
      adds: Builds and updates packages from the AUR
    yay:
      command: [yay, --version]
      adds: Builds and updates packages from the AUR
    reflector:
      command: [reflector, --help]
      adds: Ranks the mirrors by speed
    flatpak:
      command: [flatpak, --version]
      adds: Updates and cleans up Flatpak apps
      needs: desktop
    fwupd:
      command: [fwupdmgr, --version]
      adds: Updates the firmware of the device
  desktop:
    gnome-arch-update:
      command: [arch_update_dir]
      adds: A GNOME Shell extension that shows pending updates in the top bar
      needs: gnome
      extension: true
    libnotify:
      command: [notify-send, --version]
      adds: Desktop notifications about new updates
      needs: desktop
    meld:
      command: [meld, --version]
      adds: Merges configuration updates side by side
      needs: desktop
