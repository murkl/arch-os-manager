[package]
name = "system-manager"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/murkl/arch-os-manager"
publish = false

[dependencies]
fontdue = "0.9.4"
jiff = "0.2"
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
roxmltree = "0.21"
rustix = { version = "1.1.5", features = ["fs", "pipe", "process", "pty", "stdio", "termios"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1"
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
unicode-width = "0.2"
vt100 = "0.16.2"
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "rwh_06"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0.0"

[dev-dependencies]
png = "0.18"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
